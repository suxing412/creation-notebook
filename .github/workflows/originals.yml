# Each batch tag (rYYYY.MM.DD-N) gets a GitHub Release holding that batch's model originals.
# The website only shows models and publishes compressed copies; the uncompressed GLBs are kept here,
# with originals.json (path, bytes, SHA-256). The producer adds the batch's source files to the same Release.
# Run it by hand (workflow_dispatch) to fill in every r tag whose Release has no originals.json yet.
name: Archive model originals

on:
  push:
    tags: ['r*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: originals
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the batch is the diff against the previous r tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Put the batch's originals into its Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          if [ "${{ github.event_name }}" = "push" ]; then
            python -I lab/tools/release_originals.py "${GITHUB_REF_NAME}"
          else
            python -I lab/tools/release_originals.py --missing
          fi
