# Publish the site on every push to main.
# docs/ stays at the site root exactly as before (all existing URLs keep working);
# the asset library (lab/) is published at /lab/, with its "../docs/" references pointed at the root.
# Source files (.blend, source ZIPs) are not published: they are in a GitHub Release, see lab/tools/assemble_site.py.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble the site
        # docs/ minus source files (they live in the GitHub Release named in docs/asset-spec/source-archive.json),
        # plus the asset library at /lab/; fails above the 1 GB Pages limit so the live site stays on the last good build
        run: python -I lab/tools/assemble_site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
