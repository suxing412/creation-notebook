<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD02有限复用 · 造物手记</title><link rel="stylesheet" href="../../../overview.css"><main style="max-width:80ch;padding:30px 20px"><nav><a href="../index.html">← 返回SD02</a> · <a href="../../../index.html#spatial-design">总览空间区</a></nav><h1>替换真实几何，不只换颜色</h1><p>同生成器保留012 A，实际以013 B替换A。直接套旧槽失败：46平方单位超界区域对应11.5立方单位正体积交叠。</p><p>按B真实地台、偏门轴重算浅槽、路线端和镜头后，通过有限几何/投影检查；默认A回归GLB逐字节不变。两个离散组合不是任意模型或连续参数通用证明，路线不是自由步行导航网格。</p><p>源包保留输入合同、失败测量、修订配置、B原生模型与CPU图；失败二进制不作为成品公开。</p><p><a href="../source.zip">完整公开源码与复用证据ZIP</a> · <a href="../review.html">设计评审、原始参考与限制</a></p><p>GPU、触屏、连续碰撞与实际游戏性能未验。</p></main></html>
